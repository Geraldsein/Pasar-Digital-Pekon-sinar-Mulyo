name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci (bukan install) supaya versi persis mengikuti package-lock.json.
      # ignore-scripts mencegah lifecycle script dependensi berjalan di CI.
      - run: npm ci --ignore-scripts

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - run: npm audit --audit-level=high
